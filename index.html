<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookshelf App</title>

    <!-- Impor script kamu di sini -->
    <!-- Lampirkan `defer` jika pemanggilan dilakukan dalam <head> -->
    <script defer src="main.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
    <style>
      .bg-green {
        background-color: #00c2a6;
      }
      .bg-dark-green {
        background-color: #089778;
      }
      .btn-green {
        background-color: #00ad88;
        color: white;
      }
      .btn-green:hover {
        background-color: #089778;
        color: white;
      }
    </style>
  </head>
  <body>
    <header class="bg-green p-3 mb-5 shadow">
      <h1 class="text-white px-3">Bookshelf App</h1>
    </header>

    <main class="container d-flex flex-column align-items-center">
      <section
        class="bg-green rounded p-4 py-5 mb-5 text-light shadow row col-10"
      >
        <h2>Tambah Buku Baru</h2>
        <form id="bookForm" data-testid="bookForm">
          <div class="mb-3">
            <label for="bookFormTitle" class="form-label">Judul</label>
            <input
              id="bookFormTitle"
              type="text"
              required
              data-testid="bookFormTitleInput"
              class="form-control"
            />
          </div>
          <div class="mb-3">
            <label for="bookFormAuthor" class="form-label">Penulis</label>
            <input
              id="bookFormAuthor"
              type="text"
              required
              data-testid="bookFormAuthorInput"
              class="form-control"
            />
          </div>
          <div class="mb-3">
            <label for="bookFormYear" class="form-label">Tahun</label>
            <input
              id="bookFormYear"
              type="number"
              required
              data-testid="bookFormYearInput"
              class="form-control"
            />
          </div>
          <div class="form-check mb-3">
            <label for="bookFormIsComplete" class="form-label"
              >Selesai dibaca</label
            >
            <input
              id="bookFormIsComplete"
              type="checkbox"
              data-testid="bookFormIsCompleteCheckbox"
              class="form-check-input"
            />
          </div>
          <button
            id="bookFormSubmit"
            type="submit"
            data-testid="bookFormSubmitButton"
            class="btn btn-green shadow-sm py-2"
          >
            Masukkan Buku ke rak <span>Belum selesai dibaca</span>
          </button>
        </form>
      </section>

      <section class="bg-green rounded p-4 mb-5 text-light shadow row col-10">
        <h2>Cari Buku</h2>
        <form
          id="searchBook"
          data-testid="searchBookForm"
          class="input-group mb-3"
        >
          <label for="searchBookTitle" class="form-label col-12">Judul</label>
          <input
            id="searchBookTitle"
            type="text"
            data-testid="searchBookFormTitleInput"
            class="form-control rounded-start shadow-sm"
          />
          <button
            id="searchSubmit"
            type="submit"
            data-testid="searchBookFormSubmitButton"
            class="btn btn-green px-5 shadow-sm"
          >
            Cari
          </button>
        </form>
      </section>

      <section class="bg-green rounded p-4 mb-5 text-light shadow row col-10">
        <h2>Belum selesai dibaca</h2>

        <div id="incompleteBookList" data-testid="incompleteBookList">
          <!-- 
            Ini adalah struktur HTML untuk masing-masing buku.
            Pastikan susunan elemen beserta atribut data-testid menyesuaikan seperti contoh ini.
          -->
          <div
            data-bookid="123123123"
            data-testid="bookItem"
            class="bg-dark-green rounded p-3 mb-3 text-light shadow"
          >
            <h3 data-testid="bookItemTitle">Judul Buku 1</h3>
            <p data-testid="bookItemAuthor">Penulis: Penulis Buku 1</p>
            <p data-testid="bookItemYear">Tahun: 2030</p>
            <div>
              <button
                data-testid="bookItemIsCompleteButton"
                class="btn btn-outline-light shadow-sm py-2"
              >
                Selesai dibaca
              </button>
              <button
                data-testid="bookItemDeleteButton"
                class="btn btn-outline-light shadow-sm py-2"
              >
                Hapus Buku
              </button>
              <button
                data-testid="bookItemEditButton"
                class="btn btn-outline-light shadow-sm py-2"
              >
                Edit Buku
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="bg-green rounded p-4 mb-5 text-light shadow row col-10">
        <h2>Selesai dibaca</h2>

        <div id="completeBookList" data-testid="completeBookList">
          <!-- 
            Ini adalah struktur HTML untuk masing-masing buku.
            Pastikan susunan elemen beserta atribut data-testid menyesuaikan seperti contoh ini.
          -->
          <div data-bookid="456456456" data-testid="bookItem">
            <h3 data-testid="bookItemTitle">Judul Buku 2</h3>
            <p data-testid="bookItemAuthor">Penulis: Penulis Buku 2</p>
            <p data-testid="bookItemYear">Tahun: 2030</p>
            <div>
              <button
                data-testid="bookItemIsCompleteButton"
                class="btn btn-green shadow-sm py-2"
              >
                Selesai dibaca
              </button>
              <button
                data-testid="bookItemDeleteButton"
                class="btn btn-green shadow-sm py-2"
              >
                Hapus Buku
              </button>
              <button
                data-testid="bookItemEditButton"
                class="btn btn-green shadow-sm py-2"
              >
                Edit Buku
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
